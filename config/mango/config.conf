blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0
layer_animations=0

shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadowscolor=0x000000ff
# Layout options: tile, scroller, grid, deck, monocle, center_tile, 
# vertical_tile, vertical_scroller, vertical_grid, vertical_deck, 
# right_tile, tgmix
# Set layout for all tags at once (equivalent to the two rules below)
tagrule=id:*,layout_name:scroller

# Focus window under pointer at screen edges
edge_scroller_pointer_focus=1

# Chọn layout scroller cho tag bạn muốn (ví dụ tag 1)
tagrule=id:1,layout_name:scroller

# Tắt việc bỏ qua tỷ lệ cho cửa sổ đơn
scroller_ignore_proportion_single=0

# Đặt tỷ lệ cho cửa sổ đơn là 100%
scroller_default_proportion_single=1.0

# Đặt tỷ lệ mặc định cho các cửa sổ khi có từ 2 cửa sổ trở lên là 50%
scroller_default_proportion=0.5

# Danh sách các tỷ lệ bạn muốn, phân tách bằng dấu phẩy
scroller_proportion_preset=1.0,0.3,0.5,0.7

new_is_master=0

borderpx=0
# Auto start 
exec-once=noctalia
exec-once=fcitx5 -d &
exec-once=wl-paste --watch cliphist store
monitorrule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.25
exec-once=echo "Xft.dpi: 111" | xrdb -merge


# Toggle overview mode
bind=SUPER,Tab,toggleoverview

# ==============================

# Personal MangoWM Keybindings

# Converted from Niri

# ==============================

# ------------------------------

# Applications

# ------------------------------

# Terminal

bind=SUPER,q,spawn,kitty

# Application launcher

bind=SUPER,d,spawn,sh -c "noctalia msg panel-toggle launcher"

# Lock screen

bind=SUPER,l,spawn,sh -c "noctalia msg session lock"

# Clipboard

bind=SUPER,v,spawn,sh -c "noctalia msg panel-toggle clipboard"

# ------------------------------

# Audio

# ------------------------------

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ------------------------------

# Brightness

# ------------------------------

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 5%-

# ------------------------------

# Overview / Window

# ------------------------------

# Toggle overview

bind=ALT,o,toggleoverview

# Close focused window

bind=SUPER,c,killclient

# Toggle floating

bind=SUPER,f,togglefloating

# Toggle between layouts

bind=SUPER,r,switch_proportion_preset

# ------------------------------

# Focus

# ------------------------------

bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,Tab,focusstack,next
# ------------------------------

# Move / Swap windows

# ------------------------------

# Closest Mango equivalent to Niri's

# consume-or-expel / move-window behavior

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# ------------------------------

# Tags / Workspaces

# ------------------------------

# Move to previous / next tag

bind=SUPER,Page_Down,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0

# Move tag itself

bind=SUPER+SHIFT,Page_Down,tagtoright,0
bind=SUPER+SHIFT,Page_Up,tagtoleft,0

# ------------------------------

# Direct tag selection

# ------------------------------

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# ------------------------------

# Move window to tag

# ------------------------------

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# ------------------------------

# Scroller / Window proportion

# ------------------------------

# Niri: Mod+Minus / Mod+Equal

# Mango equivalent: change focused window proportion

bind=SUPER,Minus,set_proportion,-0.1
bind=SUPER,Equal,set_proportion,+0.1

# Cycle through Mango proportion presets


# ------------------------------

# Floating / Tiling

# ------------------------------

bind=SUPER+SHIFT,f,togglefloating

# Switch focus between floating and tiling

# Not directly available in Mango.

# Deliberately omitted.

# ------------------------------

# Screenshots

# ------------------------------

bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=CTRL,Print,spawn,noctalia msg screenshot-fullscreen
#bind=ALT,Print,spawn,grim -g "$(slurp)"

# ------------------------------

# Keyboard shortcuts inhibit

# ------------------------------

# Niri's toggle-keyboard-shortcuts-inhibit

# has no direct Mango equivalent.

# Deliberately omitted.

# ------------------------------

# Quit

# ------------------------------

# Use Mango's quit action.

# Unlike Niri, this may quit the compositor directly.

bind=SUPER+SHIFT,e,quit

# ------------------------------

# Mouse

# ------------------------------

# SUPER + left drag = move window

mousebind=SUPER,btn_left,moveresize,curmove

# SUPER + right drag = resize window

mousebind=SUPER,btn_right,moveresize,curresize

# Middle click = maximize

mousebind=NONE,btn_middle,togglemaximizescreen,0

# ------------------------------

# Scroll wheel

# ------------------------------

# SUPER + wheel = switch tag

axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# SUPER + SHIFT + wheel = move tag

# Mango does not expose an exact equivalent of

# Niri's move-column-to-workspace-down/up through axisbind.

# Therefore omitted.

# ------------------------------

# Reload Mango configuration

# ------------------------------

# Optional but strongly recommended

bind=SUPER+SHIFT,r,reload_config

