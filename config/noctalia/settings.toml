[backdrop]
blur_intensity = 0.0

[bar.default]
background_opacity = 0.4999999888241291
capsule_thickness = 0.35999999567866325
end = [ "media", "tray", "clipboard", "notifications", "network", "bluetooth", "volume", "battery", "session" ]
font_family = "JetBrainsMono NF"
margin_edge = 3
margin_ends = 0
panel_overlap = 3
radius_top_left = 15
shadow = false
start = [ "workspaces", "active_window" ]
thickness = 30
widget_spacing = 8

[calendar]
enabled = true

[control_center]
sidebar = "none"
sidebar_section = "none"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
pinned = [ "brave-browser" ]

[location]
sunrise = "05:00"
sunset = "20:00"

[lockscreen]
allow_empty_password = true
blur_intensity = 0.39999999105930328

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 768.0
    cy = 745.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[nightlight]
enabled = true
temperature_day = 8000

[notification]
position = "top_left"

[plugins]
enabled = []

[shell]
font_family = "JetBrainsMono NF"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
settings_show_advanced = true
ui_scale = 0.95000000670552254

    [shell.launcher]
    categories = false

    [shell.panel]
    borders = false
    floating_offset = 3
    launcher_categories = false
    launcher_compact = true
    shadow = false

    [shell.shadow]
    alpha = 0.0

[system.monitor]
enabled = false

[theme]
source = "wallpaper"

    [theme.templates]
    enable_community_templates = false

[wallpaper]
directory = "/home/minhchau/Pictures"
fill_mode = "fit"
transition = [ "disc", "fade" ]

    [wallpaper.default]
    path = "/home/minhchau/Pictures/70059505_p0.jpg"

    [wallpaper.last]
    path = "/home/minhchau/Pictures/70059505_p0.jpg"

[weather]
enabled = false

[widget.active_window]
display = "text_only"
max_length = 636
title_scroll = "on_hover"

[widget.battery]
display_mode = "graphic"

[widget.clock]
tooltip_format = "{:%H:%M %d/%m/%Y}"

[widget.media]
hide_when_no_media = true
max_length = 305
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.volume]
scroll_step = 2
show_label = false